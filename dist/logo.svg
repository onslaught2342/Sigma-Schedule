<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-labelledby="srA srB"><title id="srA">SocialRework animated logo</title><desc id="srB">Play triangle with rotating transform arrows and subtle pulse</desc><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7C3AED"></stop><stop offset="1" stop-color="#06B6D4"></stop></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><path id="arrowShape" d="M0 -18 A32 32 0 1 1 0 18" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"></path></defs><circle cx="70" cy="70" r="42" fill="url(#lg)" opacity="0.08"></circle><g transform="translate(70,70)" filter="url(#glow)"><use href="#arrowShape" transform="rotate(25)"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"></animateTransform></use><use href="#arrowShape" transform="scale(-1,1) rotate(-20)"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="9s" repeatCount="indefinite"></animateTransform></use><path d="M-2 -44 L2 -40 L-6 -38 z" fill="#7C3AED" transform="rotate(40)"></path></g><g transform="translate(70,70)"><circle cx="0" cy="0" r="20" fill="#071127" opacity="0.06"></circle><path d="M-6 -8 L18 0 L -6 8 z" fill="url(#lg)" transform="translate(0,0)"><animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.06;1" dur="2.6s" repeatCount="indefinite"></animateTransform></path><path d="M-6 -8 L18 0 L -6 8 z" fill="none" stroke="#fff" stroke-width="0.8" stroke-linejoin="round" opacity="0.85"></path></g></svg> 